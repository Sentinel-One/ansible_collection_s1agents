---
# Windows support-tier routing (ADR 0008 / issue 02). Runs as a side_effect
# step - once, after idempotence - rather than inside converge.yml, so these
# mocked/expected-failure cases aren't re-run a second time by the
# idempotence re-converge for no added signal.
#
# side_effect.yml is its own ansible-playbook invocation, so s1_agent_common
# (a meta dependency of s1_agent_upgrade) hasn't run yet in this play; the
# "Prime" task below runs it for real once so Ansible skips re-running it on
# each case's own include_role below (a role dependency only runs once per
# play), letting a direct s1_windows_tier set_fact reliably override the tier
# for each case (issue 01 already proved classification; this only proves
# routing). s1_agent_src is already a real, cached fact from the earlier
# converge, so none of these cases trigger a fresh download.
- name: Side effect
  hosts: all
  gather_facts: false
  tasks:
    - name: Windows support-tier routing cases
      when: ansible_os_family == 'Windows'
      block:
        - name: Prime s1_agent_common for this play
          ansible.builtin.include_role:
            name: s1_agent_common

        - name: "Case: Legacy tier fails loud via unsupported.yml"
          block:
            - name: Reset case-rescued marker
              ansible.builtin.set_fact:
                s1_case_rescued: false

            - name: Mock Legacy tier
              ansible.builtin.set_fact:
                s1_windows_tier: legacy

            - name: Attempt upgrade on a mocked Legacy-tier host (expected to fail)
              ansible.builtin.include_role:
                name: s1_agent_upgrade
              vars:
                s1_reboot_handler_name: Reboot Node | {{ ansible_os_family }} | Unit Testing
          rescue:
            - name: Mark this case as correctly rescued
              ansible.builtin.set_fact:
                s1_case_rescued: true

            - name: Assert the failure came from unsupported.yml
              ansible.builtin.assert:
                that:
                  - ansible_failed_result.msg is search('not currently supported')
          always:
            - name: Assert the Legacy-tier case actually failed
              ansible.builtin.assert:
                that:
                  - s1_case_rescued | bool

        - name: "Case: Legacy Plus tier rejects a version >= 24.1 pre-flight"
          block:
            - name: Reset case-rescued marker
              ansible.builtin.set_fact:
                s1_case_rescued: false

            - name: Mock Legacy Plus tier and an incompatible version
              ansible.builtin.set_fact:
                s1_windows_tier: legacy_plus
                s1_agent_version: "24.1.5.277"

            # yamllint disable-line rule:line-length
            - name: Attempt upgrade on a mocked Legacy-Plus-tier host (expected to fail the ceiling assert)
              ansible.builtin.include_role:
                name: s1_agent_upgrade
              vars:
                s1_reboot_handler_name: Reboot Node | {{ ansible_os_family }} | Unit Testing
          rescue:
            - name: Mark this case as correctly rescued
              ansible.builtin.set_fact:
                s1_case_rescued: true

            - name: Assert the failure came from the version-ceiling assert
              ansible.builtin.assert:
                that:
                  - ansible_failed_result.msg is search('cannot run SentinelOne Agent')
          always:
            - name: Assert the Legacy-Plus-ceiling case actually failed
              ansible.builtin.assert:
                that:
                  - s1_case_rescued | bool

        # The target version (23.4.x) is older than whatever this box is
        # already running (the upgrade above always moves to the newest
        # release), so s1_agent_upgrade's own s1_prior_version guard skips
        # the actual upgrade attempt - safely proving the ceiling assert
        # passes and routing reaches windows_legacy_plus.yml for a
        # supported version, without a live downgrade.
        - name: "Case: Legacy Plus tier proceeds past the ceiling assert for a supported version"
          block:
            - name: Mock Legacy Plus tier and a supported 23.4.x version
              ansible.builtin.set_fact:
                s1_windows_tier: legacy_plus
                s1_agent_version: "23.4.6.347"

            - name: Attempt upgrade on a mocked Legacy-Plus-tier host via the frozen flow
              ansible.builtin.include_role:
                name: s1_agent_upgrade
              vars:
                s1_reboot_handler_name: Reboot Node | {{ ansible_os_family }} | Unit Testing

        # Issue 03: a Legacy Plus host with no explicit s1_agent_version would
        # otherwise fall through to s1_agent_download's release_n_minus
        # fallback (latest GA) and fail the ceiling assert above after a
        # wasted download. Re-running s1_agent_common here (a fresh, explicit
        # include - not a re-triggered role dependency) applies the pin before
        # s1_agent_upgrade routes to the frozen flow, proving the auto-picked
        # version completes end-to-end (AC 5 of issue 03). As above, the
        # target (23.4.6.347) is older than whatever this box is already
        # running, so s1_prior_version safely no-ops the actual upgrade.
        - name: "Case: Legacy Plus tier with no explicit version auto-pins the default"
          block:
            - name: Mock Legacy Plus tier with no version requested
              ansible.builtin.set_fact:
                s1_windows_tier: legacy_plus
                s1_agent_version: ""

            - name: Apply the Legacy Plus default version pin
              ansible.builtin.include_role:
                name: s1_agent_common
                tasks_from: windows_legacy_plus_version_pin.yml

            - name: Assert the Legacy Plus default version was pinned
              ansible.builtin.assert:
                that:
                  - s1_agent_version == s1_legacy_plus_default_version

            - name: Attempt upgrade on the auto-pinned version via the frozen flow
              ansible.builtin.include_role:
                name: s1_agent_upgrade
              vars:
                s1_reboot_handler_name: Reboot Node | {{ ansible_os_family }} | Unit Testing
