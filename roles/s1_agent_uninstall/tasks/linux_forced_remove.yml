---
# tasks file for s1_agent_uninstall

- name: Show s1_agent_info
  ansible.builtin.debug:
    var: s1_agent_info

- name: Stop and disable the SentinelOne service | Linux
  ansible.builtin.service:
    name: "{{ s1_service_name }}"
    state: stopped
    enabled: false
  become: true
  when:
    - s1_agent_info.service_status is defined
    - s1_agent_info.service_status is not none
    - s1_agent_info.service_status | length > 0

- name: Remove the SentinelOne service files | Linux
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  with_items:
    - /usr/lib/systemd/system/sentinelone.service
    - /lib/systemd/system/sentinelone.service
    - /etc/init.d/sentineld

# Where the agent really lives comes from the endpoint, never from
# s1_agent_custom_install_path alone (TSS-25). The custom path is deleted only
# when the default path is a symlink whose target holds the agent's sentinelctl.
# The variable is a consistency check on that, not a source of the delete path.
- name: Look at the default install path | Linux
  ansible.builtin.stat:
    path: "{{ s1_agent_default_install_path }}"
    follow: false
  become: true
  register: s1_default_path_stat

- name: Look at the symlink target | Linux
  ansible.builtin.stat:
    path: "{{ s1_default_path_stat.stat.lnk_source }}"
    follow: false
  become: true
  register: s1_symlink_target_stat
  when:
    - s1_default_path_stat.stat.islnk | default(false)
    - s1_default_path_stat.stat.lnk_source is defined

- name: Look for the agent marker in the symlink target | Linux
  ansible.builtin.stat:
    path: "{{ s1_default_path_stat.stat.lnk_source }}/bin/sentinelctl"
    follow: false
  become: true
  register: s1_symlink_marker_stat
  when:
    - s1_default_path_stat.stat.islnk | default(false)
    - s1_default_path_stat.stat.lnk_source is defined

- name: Decide whether a custom install path is safe to delete | Linux
  ansible.builtin.set_fact:
    s1_custom_target: "{{ s1_default_path_stat.stat.lnk_source | regex_replace('/+$', '') }}"
    s1_custom_target_ok: >-
      {{ (s1_default_path_stat.stat.islnk | default(false))
         and (s1_symlink_marker_stat.stat.exists | default(false))
         and (s1_symlink_marker_stat.stat.isreg | default(false))
         and ((s1_agent_custom_install_path | default('') | string | length == 0)
              or (s1_agent_custom_install_path | regex_replace('/+$', '')
                  == s1_default_path_stat.stat.lnk_source | regex_replace('/+$', ''))) }}
  when: s1_default_path_stat.stat.lnk_source is defined

- name: Skip the custom install path | Linux
  ansible.builtin.debug:
    msg: >-
      WARNING: not deleting the custom install path
      {{ s1_agent_custom_install_path }}. {{ s1_default_path_stat.stat.path }}
      is not a symlink to a directory that holds the agent's sentinelctl, or it
      points somewhere other than s1_agent_custom_install_path. Only the default
      path is removed.
  when:
    - s1_agent_custom_install_path is defined
    - s1_agent_custom_install_path | default('') | string | length > 0
    - not (s1_custom_target_ok | default(false) | bool)
    # A link whose target is already gone is a rerun after a partial failure:
    # nothing is left to delete, so there is nothing to warn about.
    - not ((s1_default_path_stat.stat.islnk | default(false))
      and not (s1_symlink_target_stat.stat.exists | default(false)))

- name: Unmount SentinelOne directories | Linux
  ansible.posix.mount:
    path: "{{ item }}"
    state: unmounted
  become: true
  with_items:
    - "{{ s1_agent_default_install_path }}/mount"
    - "{{ s1_agent_default_install_path }}/cgroups/memory"
    - "{{ s1_agent_default_install_path }}/rpm_mount"

# /proc/mounts lists the real path, so a custom install's mounts are unmounted
# at the symlink target too, before anything is deleted.
- name: Unmount SentinelOne directories at the custom install path | Linux
  ansible.posix.mount:
    path: "{{ item }}"
    state: unmounted
  become: true
  with_items:
    - "{{ s1_custom_target }}/mount"
    - "{{ s1_custom_target }}/cgroups/memory"
    - "{{ s1_custom_target }}/rpm_mount"
  when: s1_custom_target_ok | default(false) | bool

- name: Remove the custom install path found through the symlink | Linux
  ansible.builtin.file:
    path: "{{ s1_custom_target }}"
    state: absent
  become: true
  when: s1_custom_target_ok | default(false) | bool

- name: Remove the default SentinelOne directory | Linux
  ansible.builtin.file:
    path: "{{ s1_agent_default_install_path }}"
    state: absent
  become: true
  when: not (s1_default_path_stat.stat.islnk | default(false))

- name: Remove the sentinelone user | Linux
  ansible.builtin.user:
    name: sentinelone
    state: absent
    remove: true
  become: true

- name: Remove SentinelOne apt package | Linux
  ansible.builtin.file:
    path: /var/lib/dpkg/info/{{ s1_package_name }}.*
    state: absent
  become: true
  when: ansible_pkg_mgr in apt_pkg_mgrs

- name: Remove the SentinelOne package from dpkg | Linux
  ansible.builtin.command: dpkg --purge --force-all {{ s1_package_name }} # noqa command-instead-of-module
  become: true
  register: dpkg_remove
  changed_when:
    - '"Purging configuration files for " ~ s1_package_name ~ "" in dpkg_remove.stdout'
  when:
    - ansible_pkg_mgr in apt_pkg_mgrs

- name: Remove the SentinelOne package from rpm | Linux
  ansible.builtin.command: rpm -ev --noscripts {{ s1_package_name }} # noqa command-instead-of-module
  become: true
  register: rpm_remove
  changed_when:
    - '"Preparing packages...\n" ~ s1_package_name ~ "" in rpm_remove.stdout'
  failed_when:
    - rpm_remove is failed
    - '"package " ~ s1_package_name ~ " is not installed" not in rpm_remove.stderr'
  when:
    - ansible_pkg_mgr in rpm_pkg_mgrs

# The symlink is the breadcrumb that leads to a custom install, so it goes last:
# a rerun after any earlier failure still sees the same layout.
- name: Remove the default SentinelOne symlink | Linux
  ansible.builtin.file:
    path: "{{ s1_agent_default_install_path }}"
    state: absent
  become: true
  when: s1_default_path_stat.stat.islnk | default(false)
