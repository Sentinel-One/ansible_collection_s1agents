---
# Pre-install checks for a custom Windows data path (INSTALL_PATH_DATA), from
# the KB "Customizing the Path of Agent Files" (000005516). Included after
# "Get disk facts | Windows" by both Windows install task files. Skipped when
# no data path is set or the data path is on the system drive, where only the
# 2 GB system-disk check applies.
#
# win_disk_facts does not expose a reliable fixed-versus-removable flag (a USB
# hard disk reports as fixed to Windows too), so the "fixed drive" requirement
# is not asserted here. The fail message says so.

- name: Resolve the data path drive | Windows
  ansible.builtin.set_fact:
    s1_data_drive_letter: "{{ s1_agent_custom_install_path[0] | upper }}"
    s1_system_drive_letter: "{{ (ansible_env.SystemDrive | default('C:'))[0] | upper }}"
  when:
    - s1_agent_custom_install_path is defined
    - s1_agent_custom_install_path is not none
    - s1_agent_custom_install_path | string | length > 0

- name: Assert the data path drive meets requirements | Windows
  vars:
    s1_data_drive_volumes: >-
      {{ ansible_facts.disks | map(attribute='partitions') | flatten
         | selectattr('volumes', 'defined') | map(attribute='volumes') | flatten
         | selectattr('drive_letter', 'defined')
         | selectattr('drive_letter', 'equalto', s1_data_drive_letter) | list }}
    s1_data_drive: "{{ s1_data_drive_volumes | first | default({}) }}"
  ansible.builtin.assert:
    that:
      - s1_data_drive_volumes | length > 0
      - (s1_data_drive.file_system | default('') | upper) == 'NTFS'
      - (s1_data_drive.size_remaining | default(0) | int) >= 4294967296
    fail_msg: >-
      The data path drive {{ s1_data_drive_letter }}: ({{ s1_agent_custom_install_path }})
      must exist, be NTFS, and have at least 4GB free when it is not the
      system drive. Found:
      {{ 'no such drive' if s1_data_drive_volumes | length == 0
         else (s1_data_drive.file_system | default('unknown file system'))
              ~ ', ' ~ ((s1_data_drive.size_remaining | default(0) | int) // 1048576) ~ ' MB free' }}.
      Whether the drive is fixed rather than removable is not checked here, so
      confirm it is not USB or other removable media.
      Review https://community.sentinelone.com/s/article/000005516
  when:
    - s1_data_drive_letter is defined
    - s1_data_drive_letter != s1_system_drive_letter
