name: CI Setup
description: >-
  Bootstraps the uv-managed toolchain (.venv from requirements-dev.txt, Galaxy
  collections) and, when requested, the KVM/libvirt/Vagrant virtualization stack

inputs:
  enable_kvm:
    description: "Install the KVM/libvirt/Vagrant virtualization stack"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    - name: Create venv and install dev toolchain
      shell: bash
      run: |
        uv venv --python 3.12
        uv pip install -r requirements-dev.txt
        # Ansible's interpreter discovery for the "local" connection (used to
        # create the Vagrant instance) resolves python3 from PATH, not from
        # whichever interpreter launched ansible-playbook. Put the venv first
        # so that lookup - and every later `molecule`/`ansible-*` invocation
        # in this job - resolves to it instead of the system interpreter.
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

    - name: Install Galaxy collection dependencies
      shell: bash
      run: .venv/bin/ansible-galaxy collection install -r requirements.yml

    # /dev/kvm is not exposed to the runner user by default; this is the exact
    # udev rule GitHub documents for unlocking hardware-accelerated nested
    # virtualization on hosted Ubuntu runners. See docs/research/github-actions-nested-vms.md.
    - name: Enable KVM device access
      if: inputs.enable_kvm == 'true'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # Ubuntu's own apt repos don't ship a current Vagrant package; HashiCorp's
    # official apt repo is the vendor-documented install path.
    - name: Add HashiCorp apt repository
      if: inputs.enable_kvm == 'true'
      shell: bash
      run: |
        wget -O- https://apt.releases.hashicorp.com/gpg \
          | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
          | sudo tee /etc/apt/sources.list.d/hashicorp.list

    - name: Install KVM/libvirt/Vagrant virtualization stack
      if: inputs.enable_kvm == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          qemu-kvm libvirt-daemon-system libvirt-dev \
          ebtables dnsmasq-base vagrant cpu-checker
        sudo usermod -aG kvm,libvirt "$(whoami)"
        sudo systemctl restart libvirtd
        # The current login session predates the group change above; loosen
        # the libvirt socket directly rather than requiring a fresh login.
        sudo chmod 666 /var/run/libvirt/libvirt-sock
        vagrant plugin install vagrant-libvirt

    # Permanent infrastructure assertion, not a test seam: turns a future
    # runner-image regression that removes nested virt into an immediate,
    # legible failure instead of an opaque Vagrant boot timeout.
    - name: Guard KVM availability
      if: inputs.enable_kvm == 'true'
      shell: bash
      run: |
        if [ ! -e /dev/kvm ]; then
          echo "::error::/dev/kvm is not present on this runner - nested virtualization is unavailable"
          exit 1
        fi
        if ! kvm-ok; then
          echo "::error::kvm-ok reports hardware-accelerated virtualization is unavailable"
          exit 1
        fi
