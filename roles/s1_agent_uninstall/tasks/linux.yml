---
# tasks file for s1_agent_uninstall

# The only Linux removal is the agent's own graceful uninstall, authorised by
# the endpoint's passphrase. There is no forced remove: from agent 25.1 the
# kernel can protect the agent (BPF with LSM), which blocks deleting its
# service and files, and an unrequested root delete was a route to TSS-25.
# See docs/adr/0014-no-automatic-forced-remove.md.
- name: Uninstall SentinelOne Agent using sentinelctl commands
  block:
    - name: Uninstall SentinelOne agent | Linux
      ansible.builtin.command:
        cmd: /opt/sentinelone/bin/sentinelctl control uninstall
        stdin: "{{ s1_agent_passphrase }}"
      become: true
      no_log: true
      register: s1_sentinelctl_uninstall
      retries: 3
      delay: 30
      until: s1_sentinelctl_uninstall.rc == 0
      changed_when: "'Successfully uninstalled agent' in s1_sentinelctl_uninstall.stdout"
  rescue:
    - name: Fail the host and point at the Knowledge Base | Linux
      ansible.builtin.fail:
        msg: >-
          The graceful uninstall of the SentinelOne agent failed on
          {{ inventory_hostname }}. The most common cause is a wrong or stale
          passphrase. The agent is still installed. See the Knowledge Base
          article on uninstalling the agent when the normal uninstall fails:
          https://community.sentinelone.com/s/article/000005374
