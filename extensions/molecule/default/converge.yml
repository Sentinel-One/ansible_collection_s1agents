---
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    - name: Include s1_agent_install
      ansible.builtin.include_role:
        name: s1_agent_install
      vars:
        s1_reboot_handler_name: Reboot Node | {{ ansible_os_family }} | Unit Testing

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Show agent version
      ansible.builtin.debug:
        var: s1_agent_version

    - name: Persist facts for verify step
      ansible.builtin.set_fact:
        s1_molecule_installed_src: "{{ s1_agent_src }}"
        # yamllint disable-line rule:line-length
        s1_molecule_installed_version: "{{ s1_agent_version if ansible_os_family != 'Windows' else s1_agent_version | regex_replace('(\\d+)\\.(\\d+)\\.(\\d+)\\.(\\d+)', '\\1.\\2.\\4') }}"
        cacheable: true

    - name: Show s1_molecule_installed_version
      ansible.builtin.debug:
        var: s1_molecule_installed_version

    # Windows support-tier routing (ADR 0008 / issue 02). These cases run
    # after the real install above and rely on s1_agent_common's dependency
    # NOT re-running on later include_role calls in the same play, so a
    # direct s1_windows_tier set_fact reliably overrides the tier for each
    # case without re-mocking the underlying OS facts (issue 01 already
    # proved classification; this only proves routing). s1_agent_src is
    # already a real, defined fact from the install above, so none of these
    # cases trigger a fresh download.
    - name: Windows support-tier routing cases
      when: ansible_os_family == 'Windows'
      block:
        - name: "Case: Legacy tier fails loud via unsupported.yml"
          block:
            - name: Reset case-rescued marker
              ansible.builtin.set_fact:
                s1_case_rescued: false

            - name: Mock Legacy tier
              ansible.builtin.set_fact:
                s1_windows_tier: legacy

            - name: Attempt install on a mocked Legacy-tier host (expected to fail)
              ansible.builtin.include_role:
                name: s1_agent_install
              vars:
                s1_reboot_handler_name: Reboot Node | {{ ansible_os_family }} | Unit Testing
          rescue:
            - name: Mark this case as correctly rescued
              ansible.builtin.set_fact:
                s1_case_rescued: true

            - name: Assert the failure came from unsupported.yml
              ansible.builtin.assert:
                that:
                  - ansible_failed_result.msg is search('not currently supported')
          always:
            - name: Assert the Legacy-tier case actually failed
              ansible.builtin.assert:
                that:
                  - s1_case_rescued | bool

        - name: "Case: Legacy Plus tier rejects a version >= 24.1 pre-flight"
          block:
            - name: Reset case-rescued marker
              ansible.builtin.set_fact:
                s1_case_rescued: false

            - name: Mock Legacy Plus tier and an incompatible version
              ansible.builtin.set_fact:
                s1_windows_tier: legacy_plus
                s1_agent_version: "24.1.5.277"

            # yamllint disable-line rule:line-length
            - name: Attempt install on a mocked Legacy-Plus-tier host (expected to fail the ceiling assert)
              ansible.builtin.include_role:
                name: s1_agent_install
              vars:
                s1_reboot_handler_name: Reboot Node | {{ ansible_os_family }} | Unit Testing
          rescue:
            - name: Mark this case as correctly rescued
              ansible.builtin.set_fact:
                s1_case_rescued: true

            - name: Assert the failure came from the version-ceiling assert
              ansible.builtin.assert:
                that:
                  - ansible_failed_result.msg is search('cannot run SentinelOne Agent')
          always:
            - name: Assert the Legacy-Plus-ceiling case actually failed
              ansible.builtin.assert:
                that:
                  - s1_case_rescued | bool

        # A real downgrade (this box already runs the version installed
        # above) is not attempted here - the SentinelOne installer's support
        # for arbitrary downgrades is unverified, and s1_agent_upgrade
        # already treats "requested version older than installed" as a
        # no-op (see the s1_prior_version guard in its own
        # windows_legacy_plus.yml). check_mode proves routing, the ceiling
        # assert, and the install task shape all work for a supported
        # version without gambling on live downgrade behavior.
        - name: "Case: Legacy Plus tier proceeds past the ceiling assert for a supported version"
          check_mode: true
          block:
            - name: Mock Legacy Plus tier and a supported 23.4.x version
              ansible.builtin.set_fact:
                s1_windows_tier: legacy_plus
                s1_agent_version: "23.4.6.347"

            - name: Dry-run install on a mocked Legacy-Plus-tier host via the frozen flow
              ansible.builtin.include_role:
                name: s1_agent_install
              vars:
                s1_reboot_handler_name: Reboot Node | {{ ansible_os_family }} | Unit Testing
