---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Assert real Server 2012 R2 OS facts were gathered
      ansible.builtin.assert:
        that:
          - s1_molecule_2012r2_facts.distribution is defined
          - s1_molecule_2012r2_facts.distribution | length > 0
          - s1_molecule_2012r2_facts.distribution_version is defined
          - s1_molecule_2012r2_facts.distribution_version | length > 0
          - s1_molecule_2012r2_facts.architecture is defined
          - s1_molecule_2012r2_facts.architecture | length > 0
        fail_msg: >-
          Expected real Windows OS facts (Caption, NT version, architecture)
          from a booted Server 2012 R2 host; see the Converge output above for
          what was actually gathered.

    - name: Report gathered facts for the tier-classification design
      ansible.builtin.debug:
        msg: >-
          ansible_distribution={{ s1_molecule_2012r2_facts.distribution }}
          ansible_distribution_version={{ s1_molecule_2012r2_facts.distribution_version }}
          ansible_architecture={{ s1_molecule_2012r2_facts.architecture }}
