---
# Frozen Legacy Plus install flow (ADR 0008). Intentionally duplicated from
# windows_64-bit.yml rather than shared, so the Modern flow can evolve freely
# without risk to this frozen path. Legacy Plus OSes cannot run Agent >= 24.1
# at all - the installer itself refuses with exit code 1007. The pre-flight
# assert below is the primary defense; the 1007 handling further down is the
# backstop in case that assert is ever bypassed.
#
# This role targets servers, not workstations, so the fixed Legacy Plus edition
# list's server members (Server 2008 R2 SP1, Server 2012) are what matters
# here - both can reach PowerShell 4+ via an official Microsoft WMF update.
# See the role README for the escape hatch on hosts that genuinely cannot.

- name: Assert PowerShell 4+ is available | Windows
  ansible.builtin.assert:
    that:
      - ansible_powershell_version | int >= 4
    fail_msg: >-
      {{ ansible_distribution }} reports PowerShell
      {{ ansible_powershell_version }}, but installing the SentinelOne Agent
      on a Legacy Plus host requires PowerShell 4.0 or newer -
      ansible.windows.win_package computes an installer checksum via
      Get-FileHash, which does not exist before PowerShell 4. See this role's
      README for a documented workaround on hosts that cannot be upgraded.
  tags:
    - s1_legacy_plus_powershell_check

- name: Assert Legacy Plus version ceiling | Windows
  ansible.builtin.assert:
    that:
      - s1_agent_version is version('24.1', '<')
    fail_msg: >-
      {{ ansible_distribution }} is a Legacy Plus host and cannot run
      SentinelOne Agent {{ s1_agent_version }} - Agent 24.1 and newer require
      64-bit Windows 8.1/Server 2012 R2 or newer. Use a 23.4.x release.

- name: Get disk facts | Windows
  community.windows.win_disk_facts:
    filter:
      - partitions
      - volumes

- name: Assert processor meets requirements | Windows
  ansible.builtin.assert:
    that:
      - ansible_processor_vcpus >= 2
    # yamllint disable-line rule:line-length
    fail_msg: The SentinelOne Agent requires a 64-bit dual core processor to be installed. Review https://community.sentinelone.com/s/article/000004969

- name: Assert disk meets requirements | Windows
  ansible.builtin.assert:
    that:
      # yamllint disable-line rule:line-length
      - (((ansible_facts.disks|selectattr('system_disk') | first).partitions | selectattr('drive_letter') | first).volumes | list | sort(reverse=true, attribute='size') | first)['size_remaining'] >= 2147483648
    # yamllint disable-line rule:line-length
    fail_msg: The SentinelOne Agent requires 2GB of free space on the Windows partition. Review https://community.sentinelone.com/s/article/000004969

- name: Assert memory meets requirements | Windows
  ansible.builtin.assert:
    that:
      - ansible_memfree_mb >= 1024
    # yamllint disable-line rule:line-length
    fail_msg: The SentinelOne Agent requires at least 1GB of free, non-cached, memory to be installed. Review https://community.sentinelone.com/s/article/000004969

- name: Set SentinelOne agent product Id | Windows
  ansible.builtin.set_fact:
    s1_agent_product_id: "{{ s1_product_id[s1_agent_win_file_ver] }}"
  when:
    - s1_product_id[s1_agent_win_file_ver] is defined
    - s1_agent_product_id is undefined

- name: Create working directory | Windows
  ansible.builtin.include_role:
    name: s1_agent_common
    tasks_from: create_work_dir.yml

- name: Set SentinelOne agent path | Windows
  ansible.builtin.set_fact:
    s1_agent_path: "{{ s1_work_dir }}\\{{ s1_agent_src | basename }}"

- name: Set SentinelOne agent parameters | Windows
  ansible.builtin.set_fact:
    # yamllint disable-line rule:line-length
    s1_agent_silent_cmd: "{{ lookup('ansible.builtin.template', (s1_install_msi | default('no') | bool | ternary('windows_agent_msi.j2', 'windows_agent_new_exe.j2'))) }}"
    s1_agent_return_code: "{{ s1_install_msi | default('no') | bool | ternary(s1_msi_return_codes, s1_new_exe_return_codes) }}"

- name: Copy SentinelOne agent | Windows
  ansible.windows.win_copy:
    src: "{{ s1_agent_src }}"
    dest: "{{ s1_agent_path }}"

# If this task fails molecule's idempotence step, check that s1_product_id contains the ProductID for the version of the agent being installed
- name: Install SentinelOne | Windows
  block:
    - name: Install SentinelOne | Windows
      ansible.windows.win_package:
        path: "{{ s1_agent_path }}"
        state: present
        arguments: "{{ s1_agent_silent_cmd }}"
        wait_for_children: true
        product_id: "{{ s1_agent_product_id | default(omit) }}"
        expected_return_code: "{{ s1_agent_return_code }}"
      become: true
      notify: "{{ s1_reboot_handler_name }}"
      register: s1_install_log
      # changed_when:
      #   - s1_agent_product_id is undefined
  rescue:
    - name: Agent version unsupported | Windows
      ansible.builtin.fail:
        msg: >-
          The SentinelOne installer refused to install {{ s1_agent_version }} on
          this Legacy Plus host (exit code 1007) - this OS cannot run Agent 24.1
          or newer. Use a 23.4.x release instead.
      when: s1_install_log.rc | default(0) == 1007

    - name: Show installation error | Windows
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg }}"
      when: s1_install_log.rc | default(0) != 1007
  always:
    - name: Show install log | Windows
      ansible.builtin.debug:
        var: s1_install_log
      tags:
        - never
        - debug

- name: Remove working directory | Windows
  ansible.windows.win_file:
    path: "{{ s1_work_dir }}"
    state: absent
  tags:
    - molecule-notest
