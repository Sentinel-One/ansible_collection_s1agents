---
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    # prepare.yml's s1_agent_version (the older, explicit 23.4.5.337 install
    # target) was cached with cacheable: true, so it would otherwise still be
    # defined here - which the pin task would read as "an operator already
    # requested a version" and skip. Blanking it in-memory (not cacheable, so
    # this doesn't disturb the disk cache) leaves s1_agent_version defined but
    # empty for this play - the pin task's own undefined-or-none-or-empty
    # check (windows_legacy_plus_version_pin.yml) treats that identically to
    # a real unversioned request. Ansible re-gathers ansible_* facts and
    # recomputes s1_windows_tier unconditionally inside s1_agent_common
    # regardless, so nothing else needs resetting - notably not
    # s1_molecule_installed_version / s1_molecule_installed_src, which
    # verify.yml still needs.
    - name: Blank the cached prior agent version so the version pin applies
      ansible.builtin.set_fact:
        s1_agent_version: ""

    - name: Include s1_agent_upgrade with no explicit version requested
      ansible.builtin.include_role:
        name: s1_agent_upgrade
      vars:
        s1_reboot_handler_name: Reboot Node | {{ ansible_os_family }} | Unit Testing

    - name: Show resolved Windows support tier and agent version
      ansible.builtin.debug:
        msg:
          s1_windows_tier: "{{ s1_windows_tier }}"
          s1_agent_version: "{{ s1_agent_version }}"

    - name: Assert this real host classified as legacy_plus
      ansible.builtin.assert:
        that:
          - s1_windows_tier == 'legacy_plus'
        fail_msg: >-
          Expected {{ ansible_distribution }} to classify as 'legacy_plus' -
          got {{ s1_windows_tier }}. See docs/adr/0008-windows-support-tier-routing.md.

    # s1_agent_upgrade's windows_legacy_plus.yml reformats s1_agent_version to
    # Windows' 3-segment display form (23.4.6.347 -> 23.4.347) before this
    # point, so the pin is verified against the same reformatting rather than
    # the raw 4-segment constant.
    - name: Assert the Legacy Plus default version pin was applied
      ansible.builtin.assert:
        that:
          # yamllint disable-line rule:line-length
          - s1_agent_version == (s1_legacy_plus_default_version | regex_replace('(\\d+)\\.(\\d+)\\.(\\d+)\\.(\\d+)', '\\1.\\2.\\4'))
        fail_msg: >-
          Expected the upgrade with no explicit version requested to
          auto-pin {{ s1_legacy_plus_default_version }} - got
          {{ s1_agent_version }}. See
          .scratch/windows-support-tier-routing/issues/03-legacy-plus-default-version-pin.md.

    - name: Persist facts for verify step
      ansible.builtin.set_fact:
        # yamllint disable-line rule:line-length
        s1_molecule_upgraded_version: "{{ s1_agent_version | regex_replace('(\\d+)\\.(\\d+)\\.(\\d+)\\.(\\d+)', '\\1.\\2.\\4') }}"
        cacheable: true
