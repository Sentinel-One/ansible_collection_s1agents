name: Lint

# The single required check on pull requests: lints the whole repo from the
# .venv toolchain. No KVM or secrets, so forks run it too. See ADR 0010.
on:
  push:
    branches:
      - "release/**"
      # TODO: drop once these workflows land on main.
      - ci/cloud-runner-poc
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up environment
        uses: ./.github/actions/ci-setup

      - name: ansible-lint
        run: ansible-lint
