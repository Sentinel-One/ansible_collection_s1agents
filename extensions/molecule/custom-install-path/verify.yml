---
# Writes the on-disk layout to the CI log (the installer puts the agent directly
# in the custom install path, no subdirectory), then asserts the removal
# behaviour: a failed graceful uninstall leaves the agent in place (ADR 0014),
# and forced remove follows the /opt/sentinelone symlink, deletes the install
# and the link, and leaves the canary beside it alone (TSS-25). The dump
# commands tolerate failure.
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Dump the custom install path layout
      become: true
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          echo "--- readlink -f /opt/sentinelone"
          readlink -f /opt/sentinelone
          echo "--- stat /opt/sentinelone (no dereference)"
          stat /opt/sentinelone
          echo "--- stat -L /opt/sentinelone (dereferenced)"
          stat -L /opt/sentinelone
          echo "--- ls -la /opt"
          ls -la /opt
          echo "--- find /srv -maxdepth 3 (owner:group type path)"
          find /srv -maxdepth 3 -printf '%u:%g %y %p\n'
          echo "--- canary /srv/keep.txt"
          ls -l /srv/keep.txt
          echo "--- sentinelctl status"
          /opt/sentinelone/bin/sentinelctl status
          echo "--- sentinelctl config"
          /opt/sentinelone/bin/sentinelctl config
          echo "--- sentinelctl version"
          /opt/sentinelone/bin/sentinelctl version
          echo "--- sentinel processes"
          ps -eo user,args | grep -i '[s]entinel'
          echo "--- mounts mentioning sentinel or /srv"
          grep -E 'sentinel|/srv' /proc/mounts
          echo "--- package file list under /srv or /opt (head)"
          { rpm -ql SentinelAgent 2>/dev/null || dpkg -L sentinelagent 2>/dev/null; } | grep -E '^/(srv|opt)' | head -40
          exit 0
      register: s1_layout_dump
      changed_when: false
      failed_when: false

    - name: Show the layout dump
      ansible.builtin.debug:
        msg: "{{ s1_layout_dump.stdout_lines + s1_layout_dump.stderr_lines }}"

    # A failed graceful uninstall must fail the host and leave the agent
    # installed and running (ADR 0014). The failure is forced by moving the
    # /opt/sentinelone link aside so sentinelctl cannot run, because the test
    # site's agent accepts any passphrase on uninstall, so a wrong passphrase
    # would not fail. The role's Linux tasks run directly (tasks_from) because
    # main.yml always re-fetches the real passphrase.
    - name: Move the default install path link aside so sentinelctl cannot run
      become: true
      ansible.builtin.command:
        cmd: mv /opt/sentinelone /opt/sentinelone.aside
      changed_when: true

    - name: Graceful uninstall that cannot run must fail the host
      block:
        - name: Include s1_agent_uninstall while sentinelctl is unavailable
          ansible.builtin.include_role:
            name: s1_agent_uninstall
            tasks_from: linux
          vars:
            s1_agent_passphrase: not-used-sentinelctl-cannot-run
            s1_forced_remove: false

        - name: The uninstall unexpectedly succeeded
          ansible.builtin.fail:
            msg: A graceful uninstall that cannot run must not succeed.
      rescue:
        - name: Record the failure message
          ansible.builtin.set_fact:
            s1_graceful_failure_msg: "{{ ansible_failed_result.msg | default('') }}"
      always:
        - name: Put the default install path link back
          become: true
          ansible.builtin.command:
            cmd: mv /opt/sentinelone.aside /opt/sentinelone
          changed_when: true

    - name: Assert the host failed with the forced-remove hint
      ansible.builtin.assert:
        that:
          - s1_graceful_failure_msg is defined
          - "'s1_forced_remove: true' in s1_graceful_failure_msg"
          - "'unexpectedly succeeded' not in s1_graceful_failure_msg"

    - name: Check the agent is still installed and running
      become: true
      ansible.builtin.systemd:
        name: sentinelone
      register: s1_still_running

    - name: Assert the agent is still installed and running
      become: true
      ansible.builtin.stat:
        path: /srv/s1agent/bin/sentinelctl
      register: s1_sentinelctl_stat
      failed_when: not s1_sentinelctl_stat.stat.exists or s1_still_running.status.ActiveState != 'active'

    # Forced remove: the target comes from the symlink, never from the variable alone.
    - name: Look at the default install path before the forced remove
      become: true
      ansible.builtin.stat:
        path: /opt/sentinelone
        follow: false
      register: s1_link_before

    - name: Assert /opt/sentinelone is a symlink to the custom install path
      ansible.builtin.assert:
        that:
          - s1_link_before.stat.islnk
          - s1_link_before.stat.lnk_source == '/srv/s1agent'

    - name: Gather the facts the uninstall role needs
      ansible.builtin.include_role:
        name: s1_agent_common

    - name: Gather the agent info the uninstall role needs
      ansible.builtin.include_role:
        name: s1_agent_info

    - name: Forced remove with the custom install path
      ansible.builtin.include_role:
        name: s1_agent_uninstall
      vars:
        s1_forced_remove: true
        s1_agent_custom_install_path: /srv/s1agent
        s1_reboot_handler_name: Reboot Node | {{ ansible_os_family }} | Unit Testing
        s1_common_skip_reboot: true

    - name: Look at the install, the link and the canary after the forced remove
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /srv/s1agent
        - /opt/sentinelone
        - /srv/keep.txt
      register: s1_after_forced_remove

    - name: Assert the install and the link are gone and the canary survived
      ansible.builtin.assert:
        that:
          - not (s1_after_forced_remove.results | selectattr('item', 'eq', '/srv/s1agent') | first).stat.exists
          - not (s1_after_forced_remove.results | selectattr('item', 'eq', '/opt/sentinelone') | first).stat.exists
          - (s1_after_forced_remove.results | selectattr('item', 'eq', '/srv/keep.txt') | first).stat.exists

    # Install must refuse a shared, non-empty custom install path before it
    # changes anything on the endpoint.
    - name: Create a shared directory that holds a file
      become: true
      ansible.builtin.copy:
        content: "not an agent install\n"
        dest: /srv/shared-dir/file.txt
        mode: "0644"
        directory_mode: "0755"

    - name: Install into the shared directory must be refused
      block:
        - name: Include s1_agent_install with a non-empty custom install path
          ansible.builtin.include_role:
            name: s1_agent_install
          vars:
            s1_agent_custom_install_path: /srv/shared-dir
            s1_reboot_handler_name: Reboot Node | {{ ansible_os_family }} | Unit Testing

        - name: The install unexpectedly succeeded
          ansible.builtin.fail:
            msg: Install into a non-empty shared directory must be refused.
      rescue:
        - name: Record the refusal message
          ansible.builtin.set_fact:
            s1_shared_dir_msg: "{{ ansible_failed_result.msg | default('') }}"

    - name: Look at the shared directory after the refused install
      become: true
      ansible.builtin.stat:
        path: /srv/shared-dir/bin
      register: s1_shared_dir_bin

    - name: Assert the install was refused with the dedicated-directory message
      ansible.builtin.assert:
        that:
          - s1_shared_dir_msg is defined
          - "'dedicated directory' in s1_shared_dir_msg"
          - not s1_shared_dir_bin.stat.exists

    - name: Remove the shared directory
      become: true
      ansible.builtin.file:
        path: /srv/shared-dir
        state: absent
