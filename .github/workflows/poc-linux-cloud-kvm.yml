name: PoC - Linux agent install on cloud KVM

# Tracer bullet for the GitHub-hosted KVM/libvirt migration (see
# .scratch/github-hosted-runners/PRD.md and issue 03). Push-triggered only:
# a push-triggered workflow runs from its own branch, whereas
# workflow_dispatch only becomes runnable once the file lands on the default
# branch. This branch carries the same-repo secrets the console API needs.
on:
  push:
    branches:
      - ci/cloud-runner-poc

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-install-poc:
    name: Rocky 8 (default scenario, libvirt)
    runs-on: ubuntu-24.04
    env:
      ANSIBLE_FORCE_COLOR: "1" # allows ansible colors to be passed to GitHub Actions
      PY_COLORS: "1" # allows molecule colors to be passed to GitHub Actions
      VAGRANT_DEFAULT_PROVIDER: libvirt
      S1_MANAGEMENT_CONSOLE: ${{ vars.S1_MANAGEMENT_CONSOLE }}
      S1_AGENT_SITE_TOKEN: ${{ secrets.S1_AGENT_SITE_TOKEN }}
      S1_API_TOKEN: ${{ secrets.S1_API_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up environment
        uses: ./.github/actions/ci-setup
        with:
          enable_kvm: "true"

      - name: Report disk usage before box creation
        run: df -h

      - name: Molecule converge (install-only smoke)
        working-directory: extensions
        run: ../.venv/bin/molecule converge -s default

      - name: Report disk usage after box creation
        run: df -h

      - name: Molecule test (full scenario)
        working-directory: extensions
        run: ../.venv/bin/molecule test -s default
