# Linting is split by domain (see docs/adr/0006-linting-toolchain.md):
#   - prettier    -> Markdown + JSON formatting (YAML is excluded, see .prettierignore);
#                    uses the locally installed prettier (brew install prettier)
#   - trufflehog  -> committed-secret scanning (uses the locally installed binary)
#   - ansible-lint -> YAML/playbook correctness; run separately, see CLAUDE.md
#
# Hooks are NOT auto-installed. Run on demand:
#   pre-commit run --all-files
---
repos:
  - repo: local
    hooks:
      # Local install rather than the mirrors-prettier hook: that one downloads
      # Node and prettier from the npm registry, which fails behind a
      # TLS-inspecting proxy. Flags match what that hook ran.
      - id: prettier
        name: prettier (Markdown + JSON)
        entry: prettier --write --list-different --ignore-unknown
        language: system
        types_or: [markdown, json]

      - id: trufflehog
        name: trufflehog secret scan
        entry: trufflehog git file://. --since-commit HEAD --results=verified,unknown --fail
        language: system
        pass_filenames: false
