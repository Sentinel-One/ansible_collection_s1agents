---
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    - name: Include s1_agent_common
      ansible.builtin.include_role:
        name: s1_agent_common

    - name: Show OS facts and resolved tier the classification produced
      ansible.builtin.debug:
        msg:
          ansible_distribution: "{{ ansible_distribution }}"
          ansible_distribution_version: "{{ ansible_distribution_version }}"
          ansible_architecture: "{{ ansible_architecture }}"
          s1_os_bitness: "{{ s1_os_bitness }}"
          s1_windows_tier: "{{ s1_windows_tier }}"

    - name: Persist facts
      ansible.builtin.set_fact:
        s1_molecule_2012r2_facts:
          distribution: "{{ ansible_distribution }}"
          distribution_version: "{{ ansible_distribution_version }}"
          architecture: "{{ ansible_architecture }}"
          os_bitness: "{{ s1_os_bitness }}"
          windows_tier: "{{ s1_windows_tier }}"
        cacheable: true
