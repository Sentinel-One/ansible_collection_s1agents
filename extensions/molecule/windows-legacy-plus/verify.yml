---
- name: Verify
  hosts: all
  gather_facts: false
  roles:
    - s1_agent_common
    - s1_agent_info
  tasks:
    - name: Show agent info
      ansible.builtin.debug:
        var: s1_agent_info

    - name: Show pre-upgrade version
      ansible.builtin.debug:
        var: s1_molecule_installed_version

    - name: Show upgraded version
      ansible.builtin.debug:
        var: s1_molecule_upgraded_version

    - name: Assert this real host classified as legacy_plus
      ansible.builtin.assert:
        that:
          - s1_windows_tier == 'legacy_plus'
        fail_msg: >-
          Expected {{ ansible_distribution }} to classify as 'legacy_plus' -
          got {{ s1_windows_tier }}. See docs/adr/0008-windows-support-tier-routing.md.

    # s1_agent_upgrade's windows_legacy_plus.yml reformats s1_agent_version to
    # Windows' 3-segment display form (23.4.6.347 -> 23.4.347) before install,
    # and converge.yml cached that reformatted value as
    # s1_molecule_upgraded_version - so the pin is verified against the same
    # reformatting rather than the raw 4-segment constant, with no need to
    # re-derive s1_agent_version fresh in this independent verify play.
    - name: Assert the Legacy Plus default version pin was applied
      ansible.builtin.assert:
        that:
          # yamllint disable-line rule:line-length
          - s1_molecule_upgraded_version == (s1_legacy_plus_default_version | regex_replace('(\\d+)\\.(\\d+)\\.(\\d+)\\.(\\d+)', '\\1.\\2.\\4'))
        fail_msg: >-
          Expected the upgrade with no explicit version requested to
          auto-pin {{ s1_legacy_plus_default_version }} - got
          {{ s1_molecule_upgraded_version }}. See
          .scratch/windows-support-tier-routing/issues/03-legacy-plus-default-version-pin.md.

    - name: Assert SentinelOne Agent is upgraded to the Legacy Plus default pin
      ansible.builtin.assert:
        that:
          - s1_agent_info is defined
          - s1_agent_info.installed | bool
          - s1_agent_info.version == s1_molecule_upgraded_version
          - s1_agent_info.version > s1_molecule_installed_version

    - name: Assert SentinelOne service is running
      ansible.builtin.assert:
        that:
          - s1_agent_info is defined
          - s1_agent_info.service_status == 'started'
          - s1_agent_info.agent_enabled == (true | bool)
