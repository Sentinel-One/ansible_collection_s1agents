---
- name: Verify
  hosts: all
  gather_facts: false
  roles:
    - s1_agent_common
  tasks:
    - name: Assert s1_download_path is defined
      ansible.builtin.assert:
        that:
          - s1_download_path is defined
          - s1_download_path is not none
          - s1_download_path | length

    # s1_tmp_linux / s1_tmp_windows are now optional overrides (undefined by
    # default); the work directory is resolved at install/upgrade time into the
    # cacheable s1_work_dir fact. See docs/adr/0004-tempfile-work-dirs.md.
    - name: Assert work-dir overrides are not set by default
      ansible.builtin.assert:
        that:
          - s1_tmp_linux is not defined
          - s1_tmp_windows is not defined

    - name: Assert s1_supported_os_family is defined
      ansible.builtin.assert:
        that:
          - s1_supported_os_family is defined
          - s1_supported_os_family | length == 2

    - name: Assert s1_supported_linux_distribution is defined
      ansible.builtin.assert:
        that:
          - s1_supported_linux_distribution is defined
          - s1_supported_linux_distribution | length == 13

    - name: Assert rpm_pkg_mgrs is defined
      ansible.builtin.assert:
        that:
          - rpm_pkg_mgrs is defined
          - rpm_pkg_mgrs | length == 3

    - name: Assert apt_pkg_mgrs is defined
      ansible.builtin.assert:
        that:
          - apt_pkg_mgrs is defined
          - apt_pkg_mgrs | length == 1

    - name: Assert s1_package_name is defined
      ansible.builtin.assert:
        that:
          - s1_package_name is defined
          - s1_package_name is not none
          - s1_package_name | length

    - name: Assert s1_service_name is defined
      ansible.builtin.assert:
        that:
          - s1_service_name is defined
          - s1_service_name is not none
          - s1_service_name | length

    - name: Assert s1_service_handler_name is defined
      ansible.builtin.assert:
        that:
          - s1_service_handler_name is defined
          - s1_service_handler_name is not none
          - s1_service_handler_name | length
      when: ansible_system == "Linux"

    - name: Windows only variables
      when: ansible_os_family == "Windows"
      block:
        - name: Assert s1_reboot_handler_name is defined
          ansible.builtin.assert:
            that:
              - s1_reboot_handler_name is defined
              - s1_reboot_handler_name is not none
              - s1_reboot_handler_name | length

        - name: Assert s1_new_exe_return_codes is defined
          ansible.builtin.assert:
            that:
              - s1_new_exe_return_codes is defined
              - s1_new_exe_return_codes | length == 8

        - name: Assert s1_msi_return_codes is defined
          ansible.builtin.assert:
            that:
              - s1_msi_return_codes is defined
              - s1_msi_return_codes | length == 2

        - name: Assert s1_product_id is defined
          ansible.builtin.assert:
            that:
              - s1_product_id is defined
              - s1_product_id | length >= 6

        - name: Assert real host classifies as modern
          ansible.builtin.assert:
            that:
              - s1_molecule_real_windows_tier == 'modern'
            fail_msg: >-
              Expected the real Windows preset (Server 2022) to classify as
              'modern' - got {{ s1_molecule_real_windows_tier }}.

        - name: Assert fact-mocked Windows support-tier cases resolved as expected
          ansible.builtin.assert:
            that:
              - s1_molecule_tier_cases['legacy'] == 'legacy'
              - s1_molecule_tier_cases['legacy_plus_bitness'] == 'legacy_plus'
              - s1_molecule_tier_cases['legacy_plus_caption'] == 'legacy_plus'
              - s1_molecule_tier_cases['modern_exclusion'] == 'modern'
            fail_msg: >-
              One or more fact-mocked tier cases resolved incorrectly:
              {{ s1_molecule_tier_cases }}. Expected legacy=legacy,
              legacy_plus_bitness=legacy_plus, legacy_plus_caption=legacy_plus,
              modern_exclusion=modern.

        - name: Assert Legacy Plus default version pin cases resolved as expected
          ansible.builtin.assert:
            that:
              - s1_molecule_pin_cases['unset_version'] == s1_legacy_plus_default_version
              - s1_molecule_pin_cases['explicit_version'] == '23.4.5.337'
            fail_msg: >-
              One or more Legacy Plus version-pin cases resolved incorrectly:
              {{ s1_molecule_pin_cases }}. Expected
              unset_version={{ s1_legacy_plus_default_version }},
              explicit_version=23.4.5.337.
