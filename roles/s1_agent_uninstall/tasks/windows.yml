---
# tasks file for s1_agent_uninstall

# Two ways to uninstall: the MSI package by product GUID (default), or the
# agent's own uninstall.exe (s1_windows_use_uninstall_exe: true, or as the retry
# when the MSI uninstall fails). If neither works the host fails and points at
# the Knowledge Base.
- name: Uninstall the SentinelOne agent | Windows
  block:
    - name: Start with no failed MSI uninstall | Windows
      ansible.builtin.set_fact:
        s1_msi_uninstall_failed: false

    - name: Uninstall SentinelOne Agent using package guid
      when: not s1_windows_use_uninstall_exe | default(false) | bool
      block:
        - name: Uninstall SentinelOne agent | Windows
          ansible.windows.win_package:
            state: absent
            arguments: UNINSTALL_KEY="{{ s1_agent_passphrase }}"
            wait_for_children: true
            product_id: "{{ s1_agent_info.product_id }}"
          become: true
          no_log: true
          register: s1_uninstall_log
          notify: "{{ s1_reboot_handler_name }}"
      rescue:
        - name: Note that the MSI uninstall failed | Windows
          ansible.builtin.set_fact:
            s1_msi_uninstall_failed: true

    - name: Include tasks to uninstall with the agent's own uninstall.exe | Windows
      ansible.builtin.include_tasks:
        file: "{{ loop_fallback_remove }}"
      with_first_found:
        - files:
            - "{{ ansible_distribution | lower }}_{{ ansible_distribution_version }}_fallback_remove.yml"
            - "{{ ansible_distribution | lower }}_{{ ansible_distribution_major_version }}_fallback_remove.yml"
            - "{{ ansible_distribution | lower }}_fallback_remove.yml"
            - "{{ ansible_os_family | lower }}_fallback_remove.yml"
            - "{{ ansible_system | lower }}_fallback_remove.yml"
            - unsupported.yml
      loop_control:
        loop_var: loop_fallback_remove
        label: "{{ loop_fallback_remove | basename }}"
      when: (s1_windows_use_uninstall_exe | default(false) | bool) or s1_msi_uninstall_failed
  rescue:
    - name: Fail the host and point at the Knowledge Base | Windows
      ansible.builtin.fail:
        msg: >-
          The uninstall of the SentinelOne agent failed on
          {{ inventory_hostname }}. It was tried with the MSI package (unless
          s1_windows_use_uninstall_exe skipped it) and then with the agent's own
          uninstall.exe. The most common cause is a wrong or stale passphrase.
          See the Knowledge Base article on uninstalling the agent when the
          normal uninstall fails:
          https://community.sentinelone.com/s/article/000005374
