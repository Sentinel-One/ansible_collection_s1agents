---
# Merge-gating matrix for `molecule.py gate` — scenarios x platforms.
# Edit this (not the script) to change what the gate runs. See ADR 0005.
#
# Dropped: centos6 (RHEL 6 EOL), WindowsServer2012R2 (EOL) — see ADR 0002.
#   WindowsServer2012R2 is narrowly revived as a classifier-only fixture (proves
#   the Legacy Plus tier's Server 2012 R2 exclusion against real facts) — see
#   extensions/molecule/windows-2012r2 and .github/workflows/windows_2012r2_facts.yml.
#   It runs only on its own paths-filtered workflow, not here. See ADR 0008.
# Dropped: forced_remove, gpg_signed_rpm, not_installed — never implemented
#   as molecule scenarios (were stale Makefile targets with no backing directory).
# Windows uses the `default` scenario with the `windows` platform preset;
#   the old `winrm_default` scenario name is gone. See ADR 0005.
#
# Consolidated matrix (18 runs vs 38 exhaustive).  Several scenarios are
# fully exercised as sub-steps of a more comprehensive scenario and are
# omitted from the default gate to reduce wall-clock time.
#
#   upgrade   → s1_agent_common, s1_agent_download (×2), s1_agent_install,
#               s1_agent_info (installed path), s1_mgmt_get_passphrase (Linux)
#   uninstall → s1_agent_uninstall, s1_mgmt_get_passphrase (Windows + Linux)
#
# Omitted (covered transitively by the scenarios above):
#   common, default, download, info-installed, passphrase
#
# Kept as standalone because they are not reached by any other scenario:
#   info-missing  — "agent absent" info path
#   gpgkey        — s1_import_gpg_key is gated out of upgrade
#                   (s1_install_gpg_signed_rpm: false)
#   uuid          — s1_agent_uuid is not called by any other scenario
- scenario: upgrade
  platforms: [rocky8, ubuntu2204, opensuse15, windows]
- scenario: uninstall
  platforms: [rocky8, ubuntu2204, opensuse15, windows]
- scenario: info-missing
  platforms: [rocky8, ubuntu2204, opensuse15, windows]
- scenario: gpgkey
  platforms: [rocky8, opensuse15]
- scenario: uuid
  platforms: [rocky8, ubuntu2204, opensuse15, windows]
